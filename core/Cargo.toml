[package]
name = "focuscore"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# SQLite storage (WAL mode), bundled so no system sqlite is required.
rusqlite = { version = "0.33", features = ["bundled"] }
# C ABI facade for C# (generated via csbindgen on CI).
libc = "0.2"
# Serialization for the sync client.
serde = { version = "1", features = ["derive"] }
# Minimal HTTP client for the sync client (with JSON support).
ureq = { version = "2", features = ["json"] }
# UUIDv7 identifiers.
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]

[profile.release]
opt-level = 2
lto = false
codegen-units = 16

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.focuscore"
    compileSdk 36

    defaultConfig {
        applicationId "com.focuscore"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.6.4"
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0"
    implementation "androidx.activity:activity-compose:1.10.0"
    implementation "androidx.navigation:navigation-compose:2.9.0"
    implementation "androidx.glance:glance-appwidget:1.2.0"
    implementation "androidx.glance:glance-material:1.2.0"
    implementation "androidx.compose.ui:ui:1.8.0"
    implementation "androidx.compose.ui:ui-graphics:1.8.0"
    implementation "androidx.compose.ui:ui-tooling-preview:1.8.0"
    implementation "androidx.compose.material3:material3:1.3.0"
    implementation "androidx.compose.material3:material3-window-size-class:1.3.0"
    implementation "androidx.compose.material:material-icons-extended:1.8.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.21"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
}
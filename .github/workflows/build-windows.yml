name: Build Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  RUST_VERSION: "stable"
  CORE_MANIFEST: core/Cargo.toml
  SOLUTION: clients/windows/FocusCore.WinUI/FocusCore.WinUI.csproj

jobs:
  build-core:
    name: Build Rust core (cdylib)
    runs-on: windows-latest
    outputs:
      dll-path: ${{ steps.dll.outputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: C:\src\focuscore
      - uses: dtolnay/rust-toolchain@stable
      - name: Build core cdylib
        run: cargo build --release --manifest-path ${{ env.CORE_MANIFEST }}
        working-directory: C:\src\focuscore
      - name: Locate dll
        id: dll
        run: |
          $path = Get-ChildItem -Path "C:\src\focuscore\core\target\release\focuscore.dll" -ErrorAction SilentlyContinue
          if (-not $path) { $path = Get-ChildItem -Path "C:\src\focuscore\core\target\release\libfocuscore.dll" -ErrorAction SilentlyContinue }
          echo "path=$($path.FullName)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: focuscore-windows-core
          path: C:\src\focuscore\core\target\release\focuscore.dll
          retention-days: 30

  build-winui:
    name: Build WinUI 3 client
    runs-on: windows-latest
    needs: build-core
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: C:\src\focuscore
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: focuscore-windows-core
          path: C:\src\focuscore\clients\windows\FocusCore.WinUI
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: microsoft/setup-msbuild@v2
      - name: Restore
        run: msbuild ${{ env.SOLUTION }} /t:Restore /p:Configuration=Release
      - name: Build WinUI 3 app (Publish)
        run: msbuild ${{ env.SOLUTION }} /t:Publish /p:Configuration=Release /p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: focuscore-windows-app
          path: C:\src\focuscore\clients\windows\FocusCore.WinUI\bin\x64\Release\publish\**
          retention-days: 30
        if: always()
name: Build Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  RUST_VERSION: "stable"
  CORE_MANIFEST: core/Cargo.toml
  ANDROID_SDK_ROOT: /usr/lib/android-sdk

jobs:
  build-core-android:
    name: Build Rust core for Android (.so)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build core for Android
        run: cargo ndk build --release
        working-directory: core
      - name: Organize Android JNI libs
        run: |
          mkdir -p jniLibs/arm64-v8a jniLibs/armeabi-v7a
          cp core/target/aarch64-linux-android/release/libfocuscore.so jniLibs/arm64-v8a/
          cp core/target/armv7-linux-androideabi/release/libfocuscore.so jniLibs/armeabi-v7a/
      - uses: actions/upload-artifact@v4
        with:
          name: focuscore-android-libs
          path: jniLibs
          retention-days: 30

  build-apk:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    needs: build-core-android
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: focuscore-android-libs
          path: clients/android/app/src/main/jniLibs
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "GRADLE_HOME=$PWD/gradle-8.10.2" >> $GITHUB_ENV
          echo "$PWD/gradle-8.10.2/bin" >> $GITHUB_PATH
      - name: Generate Gradle wrapper
        working-directory: clients/android
        run: gradle wrapper
      - name: Assemble Release APK
        working-directory: clients/android
        run: |
          for i in {1..3}; do
            ./gradlew --no-daemon --stacktrace assembleRelease && break || sleep 30
          done
      - uses: actions/upload-artifact@v4
        with:
          name: focuscore-android-apk
          path: clients/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
        if: always()
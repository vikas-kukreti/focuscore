name: Build macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  RUST_VERSION: "stable"
  CORE_MANIFEST: core/Cargo.toml

jobs:
  build-core-macos:
    name: Build Rust core (static lib)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build core static lib (Apple silicon)
        run: cargo build --release --manifest-path ${{ env.CORE_MANIFEST }} --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: focuscore-macos-core
          path: core/target/aarch64-apple-darwin/release/libfocuscore.a
          retention-days: 30

  build-app:
    name: Build macOS executable (SwiftPM)
    runs-on: macos-latest
    needs: build-core-macos
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: focuscore-macos-core
          path: clients/macos/Frameworks
      - name: Build SwiftPM executable
        working-directory: clients/macos
        run: swift build -c release
      - uses: actions/upload-artifact@v4
        with:
          name: focuscore-macos-app
          path: clients/macos/.build/release/FocusCore
          retention-days: 30
        if: always()

  create-dmg:
    name: Create macOS DMG (drag-and-drop installer)
    runs-on: macos-latest
    needs: build-app
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: focuscore-macos-app
          path: clients/macos/.build/release
      - name: Create macOS app bundle
        run: |
          APP_PATH="clients/macos/.build/release/FocusCore"
          DMG_DIR="dmg"
          APP_BUNDLE="$DMG_DIR/FocusCore.app"
          
          # Create proper macOS app bundle structure
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"
          
          # Copy executable
          cp "$APP_PATH" "$APP_BUNDLE/Contents/MacOS/FocusCore"
          chmod +x "$APP_BUNDLE/Contents/MacOS/FocusCore"
          
          # Copy Info.plist from sources
          cp "clients/macos/Sources/FocusCore/Info.plist" "$APP_BUNDLE/Contents/Info.plist"
          
          # Remove quarantine attribute to avoid "damaged" error on unsigned apps
          xattr -cr "$APP_BUNDLE"
          
          # Create DMG for drag-and-drop install
          hdiutil create -volname "FocusCore" -srcfolder "dmg" -ov -format UDZO "dmg/FocusCore.dmg"
          
          echo "DMG created at: dmg/FocusCore.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: focuscore-macos-dmg
          path: dmg/
          retention-days: 30
        if: always()
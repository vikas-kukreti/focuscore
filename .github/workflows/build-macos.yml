name: Build macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  RUST_VERSION: "stable"
  CORE_MANIFEST: core/Cargo.toml

jobs:
  build-core-macos:
    name: Build Rust core (static lib)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build core static lib (Apple silicon)
        run: cargo build --release --manifest-path ${{ env.CORE_MANIFEST }} --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: focuscore-macos-core
          path: core/target/aarch64-apple-darwin/release/libfocuscore.a
          retention-days: 30

  build-app:
    name: Build macOS executable (SwiftPM)
    runs-on: macos-latest
    needs: build-core-macos
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: focuscore-macos-core
          path: clients/macos/Frameworks
      - name: Build SwiftPM executable
        working-directory: clients/macos
        run: swift build -c release
      - uses: actions/upload-artifact@v4
        with:
          name: focuscore-macos-app
          path: clients/macos/.build/release/FocusCore
          retention-days: 30
        if: always()

  create-installer:
    name: Create macOS installer (.pkg)
    runs-on: macos-latest
    needs: build-app
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: focuscore-macos-app
          path: clients/macos/.build/release
      - name: Create installer package
        run: |
          APP_PATH="clients/macos/.build/release/FocusCore"
          INSTALLER_DIR="installer"
          PKG_ROOT="$INSTALLER_DIR/pkgroot"
          
          mkdir -p "$PKG_ROOT/Applications"
          cp -R "$APP_PATH" "$PKG_ROOT/Applications/FocusCore.app"
          
          # Create component package
          pkgbuild \
            --root "$PKG_ROOT" \
            --identifier com.focuscore \
            --version 0.1.0 \
            --install-location / \
            "$INSTALLER_DIR/FocusCore.pkg"
          
          # Create distribution package with customizations
          cat > "$INSTALLER_DIR/Distribution.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
            <title>FocusCore</title>
            <organization>com.focuscore</organization>
            <domains enable_anywhere="true"/>
            <options customize="never" require-scripts="false" rootVolumeOnly="true"/>
            <pkg-ref id="com.focuscore"/>
            <choices-outline>
              <line choice="default">
                <line choice="com.focuscore"/>
              </line>
            </choices-outline>
            <choice id="default"/>
            <choice id="com.focuscore" visible="false">
              <pkg-ref id="com.focuscore"/>
            </choice>
            <pkg-ref id="com.focuscore" version="0.1.0" onConclusion="none">FocusCore.pkg</pkg-ref>
          </installer-gui-script>
          EOF
          
          productbuild \
            --distribution "$INSTALLER_DIR/Distribution.xml" \
            --package-path "$INSTALLER_DIR" \
            "$INSTALLER_DIR/FocusCore-Installer.pkg"
          
          # Also create a DMG for easy distribution
          hdiutil create -volname "FocusCore" -srcfolder "$PKG_ROOT/Applications" -ov -format UDZO "$INSTALLER_DIR/FocusCore.dmg"
          
          echo "Installer created at: $INSTALLER_DIR/FocusCore-Installer.pkg"
          echo "DMG created at: $INSTALLER_DIR/FocusCore.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: focuscore-macos-installer
          path: installer/
          retention-days: 30
        if: always()